name: Build libbox AAR

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "SagerNet/sing-box tag, branch, or commit to build"
        required: true
        default: "v1.13.13"

jobs:
  build-libbox-aar:
    name: Build libbox.aar
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout sing-box
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ inputs.singbox_ref }}
          path: sing-box

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install gomobile tools
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          set -euo pipefail
          if make -n lib_android >/dev/null 2>&1; then
            make lib_android
          else
            go run ./cmd/internal/build_libbox -target android
          fi

      - name: Package artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          aar_path="$(find sing-box -type f -name 'libbox.aar' | head -n 1)"
          if [ -z "${aar_path}" ]; then
            echo "libbox.aar was not produced"
            find sing-box -type f -name '*.aar'
            exit 1
          fi
          cp "${aar_path}" artifact/libbox.aar
          (cd artifact && sha256sum libbox.aar > libbox.aar.sha256)
          cat artifact/libbox.aar.sha256

      - name: Upload libbox AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: |
            artifact/libbox.aar
            artifact/libbox.aar.sha256
          if-no-files-found: error
